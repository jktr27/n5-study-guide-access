.q .h{font-size:2.4rem}.q button{display:block;width:100%;margin:6px 0}

const E={'は':'Marks the topic of the sentence. Read as wa.<br>e.g. わたしは がくせい です (watashi wa gakusei desu) = I am a student.','が':'Marks the subject. Used with います/あります, すき, わかる, and for new information.<br>e.g. ねこが います (neko ga imasu) = There is a cat.','を':'Marks the direct object. Read as o.<br>e.g. みずを のみます (mizu o nomimasu) = I drink water.','に':'Marks a point in time, a destination, or where something exists.<br>e.g. 7じに おきます (shichiji ni okimasu) = I wake up at 7.','へ':'Direction toward. Read as e. Like に for movement.<br>e.g. がっこうへ いきます (gakkou e ikimasu) = I go to school.','で':'Place where an action happens, or a means or tool.<br>e.g. バスで いきます (basu de ikimasu) = I go by bus.','の':'Possession, or links two nouns.<br>e.g. わたしの ほん (watashi no hon) = my book.','と':'And (a complete list), or together with someone.<br>e.g. ともだちと いきます (tomodachi to ikimasu) = I go with a friend.','も':'Also / too. Replaces は, が, を.<br>e.g. わたしも がくせい です (watashi mo gakusei desu) = I am a student too.','や':'And (a partial list, with more items implied).<br>e.g. りんごや みかんを かいました (ringo ya mikan o kaimashita) = I bought apples, mandarins and so on.','から':'From (time or place), or because.<br>e.g. 9じから はたらきます (kuji kara hatarakimasu) = I work from 9.','まで':'Until / up to.<br>e.g. 5じまで べんきょうします (goji made benkyou shimasu) = I study until 5.','より':'Than. Used to compare.<br>e.g. バスより でんしゃが はやい です (basu yori densha ga hayai desu) = Trains are faster than buses.','か':'Put at the end of a sentence to make a question.<br>e.g. がくせい ですか (gakusei desu ka) = Are you a student?','ね':'Asks for agreement: right? / isnt it?<br>e.g. いい てんき ですね (ii tenki desu ne) = Nice weather, is it not?','よ':'Adds emphasis or tells new information: you know.<br>e.g. おいしい ですよ (oishii desu yo) = It is delicious, I tell you.','だけ':'Only.<br>e.g. みずだけ のみます (mizu dake nomimasu) = I drink only water.','しか〜ない':'Nothing but / only. Always used with a negative verb.<br>e.g. 100えんしか ありません (hyakuen shika arimasen) = I have only 100 yen.','ぐらい':'About / approximately (also くらい).<br>e.g. 1じかんぐらい かかります (ichijikan gurai kakarimasu) = It takes about an hour.','ずつ':'Each / a set amount at a time.<br>e.g. ひとつずつ とります (hitotsu zutsu torimasu) = I take one each.','など':'Such as / and so on.<br>e.g. りんごなどを かいました (ringo nado o kaimashita) = I bought apples and the like.','〜です':'Polite is / am / are. Noun + です.<br>e.g. わたしは がくせい です (watashi wa gakusei desu) = I am a student.','〜ではありません':'Polite negative of です. じゃ ありません is more casual.<br>e.g. せんせいでは ありません (sensei dewa arimasen) = I am not a teacher.','〜でした':'Polite past of です.<br>e.g. きのうは あめ でした (kinou wa ame deshita) = Yesterday was rainy.','〜があります':'There is / I have (things and plants).<br>e.g. つくえの うえに ほんが あります (tsukue no ue ni hon ga arimasu) = There is a book on the desk.','〜がいます':'There is (people and animals).<br>e.g. こうえんに いぬが います (kouen ni inu ga imasu) = There is a dog in the park.','〜ます':'Polite present / future verb ending.<br>e.g. たべます (tabemasu) = I eat / I will eat.','〜ません':'Polite negative verb ending.<br>e.g. のみません (nomimasen) = I do not drink.','〜ました':'Polite past verb ending.<br>e.g. きのう みました (kinou mimashita) = I saw it yesterday.','〜ましょう':'Lets do ~ (a suggestion).<br>e.g. いきましょう (ikimashou) = Lets go.','〜ませんか':'Invitation: would you like to ~?<br>e.g. いっしょに たべませんか (issho ni tabemasen ka) = Shall we eat together?','〜ましょうか':'Offer: shall I ~?<br>e.g. てつだいましょうか (tetsudaimashou ka) = Shall I help you?','〜たいです':'Want to do. Verb stem + たいです.<br>e.g. すしを たべたいです (sushi o tabetai desu) = I want to eat sushi.','〜て':'The te-form links actions and builds many patterns.<br>e.g. おきて、たべます (okite, tabemasu) = I get up and eat.','〜ている':'An action in progress, or a continuing state.<br>e.g. いま たべて います (ima tabete imasu) = I am eating now.','〜てください':'Please do ~.<br>e.g. みせて ください (misete kudasai) = Please show me.','〜ないでください':'Please do not ~. Plain negative + でください.<br>e.g. さわらないで ください (sawaranaide kudasai) = Please do not touch.','〜てもいいです':'It is okay to ~ / May I ~?<br>e.g. すわっても いいですか (suwattemo ii desu ka) = May I sit?','〜てはいけません':'You must not ~.<br>e.g. ここで すっては いけません (koko de sutte wa ikemasen) = You must not smoke here.','〜てから':'After doing ~.<br>e.g. ごはんを たべてから ねます (gohan o tabete kara nemasu) = I sleep after eating.','〜ない':'Plain (casual) negative.<br>e.g. たべない (tabenai) = do not eat.','〜た':'Plain (casual) past.<br>e.g. たべた (tabeta) = ate.','〜なければなりません':'Must / have to.<br>e.g. べんきょうしなければ なりません (benkyou shinakereba narimasen) = I have to study.','〜たことがあります':'Have done ~ before (experience).<br>e.g. すしを たべた ことが あります (sushi o tabeta koto ga arimasu) = I have eaten sushi.','〜たり〜たり':'Do things like A and B (examples of actions).<br>e.g. ほんを よんだり ねたり します (hon o yondari netari shimasu) = I do things like read and sleep.','〜に行く':'Go in order to do ~.<br>e.g. かいものに いきます (kaimono ni ikimasu) = I go shopping.','〜ながら':'While doing ~ (two actions at once).<br>e.g. おんがくを ききながら べんきょうします (ongaku o kikinagara benkyou shimasu) = I study while listening to music.','〜前に':'Before ~.<br>e.g. ねるまえに はを みがきます (neru mae ni ha o migakimasu) = I brush my teeth before sleeping.','〜と思います':'I think that ~.<br>e.g. あした あめだと おもいます (ashita ame da to omoimasu) = I think it will rain tomorrow.','〜でしょう':'Probably ~.<br>e.g. あした はれでしょう (ashita hare deshou) = It will probably be sunny tomorrow.','〜になる':'Become ~.<br>e.g. いしゃに なりたい です (isha ni naritai desu) = I want to become a doctor.','〜をください':'Please give me ~.<br>e.g. コーヒーを ください (koohii o kudasai) = Coffee, please.','高い':'い-adjectives end in い. Add です to be polite.<br>e.g. たかい です (takai desu) = It is expensive.','〜くない':'い-adj negative: drop い, add くない. (いい becomes よくない)<br>e.g. たかくない (takakunai) = not expensive.','〜かった':'い-adj past: drop い, add かった.<br>e.g. たかかった (takakatta) = was expensive.','〜くなかった':'い-adj negative past: drop い, add くなかった.<br>e.g. たかくなかった (takakunakatta) = was not expensive.','静かな+noun':'な-adjectives take な before a noun.<br>e.g. しずかな まち (shizuka na machi) = a quiet town.','〜じゃない':'Negative of な-adjectives and nouns.<br>e.g. しずかじゃ ありません (shizuka ja arimasen) = It is not quiet.','〜くて/〜で':'Joins adjectives: い-adj drop い add くて; な-adj add で.<br>e.g. やすくて おいしい (yasukute oishii) = cheap and delicious.','〜く+verb':'い-adj becomes an adverb: drop い, add く.<br>e.g. はやく はしる (hayaku hashiru) = run fast.','〜が好きです':'Like. The thing you like takes が.<br>e.g. ねこが すき です (neko ga suki desu) = I like cats.','〜が上手です':'Good at ~.<br>e.g. うたが じょうず です (uta ga jouzu desu) = I am good at singing.','〜がほしいです':'Want (a thing).<br>e.g. くるまが ほしい です (kuruma ga hoshii desu) = I want a car.','〜のほうが〜より':'A is more ~ than B.<br>e.g. ねこの ほうが いぬより すき です (neko no hou ga inu yori suki desu) = I like cats more than dogs.','〜で一番':'The most ~ in / among.<br>e.g. にほんで いちばん たかい やま (nihon de ichiban takai yama) = the highest mountain in Japan.','あまり〜ない':'Not very much. Always with a negative.<br>e.g. あまり たべません (amari tabemasen) = I do not eat much.','ぜんぜん〜ない':'Not at all. Always with a negative.<br>e.g. ぜんぜん わかりません (zenzen wakarimasen) = I do not understand at all.','もう':'Already (with a past verb), or not any more (with negative).<br>e.g. もう たべました (mou tabemashita) = I already ate.','まだ':'Not yet (with negative), or still.<br>e.g. まだ たべて いません (mada tabete imasen) = I have not eaten yet.','Group 1: かく→かきます':'u-verbs: the last sound changes to the い-row before ます.<br>かく → かきます, のむ → のみます, はなす → はなします.','Group 2: たべる→たべます':'ru-verbs: drop る, add ます.<br>たべる → たべます, みる → みます. (Some, like かえる, are Group 1.)','Group 3: くる・する':'Irregular verbs.<br>くる → きます (kimasu), する → します (shimasu).'};

ます · ない: みない · た: みた · て: みて|Table: おきる (wake up)=ます: おきます · ない: おきない · た: おきた · て: おきて|Table: ねる (sleep)=ます: ねます · ない: ねない · た: ねた · て: ねて|Table: くる (come)=ます: きます · ない: こない · た: きた · て: きて|Table: する (do)=ます: します · ない: しない · た: した · て: して|Table: ある (there is)=ます: あります · ない: ない · た: あった · て: あって|Table: いく (go)=ます: いきます · ない: いかない · た: いった · て: いって"});
const T={'は':['Tells what the sentence is about. Read it as wa.','Sinasabi kung tungkol saan ang pangungusap. Basahin bilang wa.'],'が':['Points to who or what does something. Also used with あります, います and すき.','Tinuturo kung sino o ano ang gumagawa. Ginagamit din sa あります, います at すき.'],'を':['Marks the thing you do the action to. Read it as o.','Nagsasabi kung ano ang ginagawan ng kilos. Basahin bilang o.'],'に':['Shows a time, a place you go to, or where something is.','Nagsasabi ng oras, pupuntahan, o kung nasaan ang isang bagay.'],'へ':['Shows direction, like to. Read it as e.','Nagsasabi ng direksyon, parang papunta sa. Basahin bilang e.'],'で':['Shows where you do something, or what you use to do it.','Nagsasabi kung saan ginagawa ang kilos, o kung ano ang gamit.'],'の':['Shows who owns something. Works like my, your or of.','Nagsasabi kung kanino ang isang bagay. Parang akin, iyo o ng.'],'と':['Means and, or with. Connects nouns, or says who you do it with.','Ibig sabihin at, o kasama. Pangdugtong ng pangngalan, o kung kasama sino.'],'も':['Means also or too. It takes the place of は, が or を.','Ibig sabihin din. Pinapalitan nito ang は, が o を.'],'や':['Means and, but only some examples. There may be more.','Ibig sabihin at, pero ilang halimbawa lang. May iba pa.'],'から':['Means from, or because.','Ibig sabihin mula sa, o dahil.'],'まで':['Means until or up to.','Ibig sabihin hanggang.'],'より':['Means than. Used to compare two things.','Ibig sabihin kaysa. Pang-ihambing ng dalawang bagay.'],'か':['Put it at the end to make a question.','Ilagay sa dulo para gawing tanong.'],'ね':['Used to ask for agreement, like right? or isnt it?','Pang-hingi ng pagsang-ayon, parang diba?'],'よ':['Used to say something firmly, like you know.','Pang-diin kapag may sinasabi, parang alam mo.'],'だけ':['Means only or just.','Ibig sabihin lang o tanging.'],'しか〜ない':['Means only. Always used with a not-ending like ません.','Ibig sabihin lang. Laging may negatibong dulo gaya ng ません.'],'ぐらい':['Means about or around a number or time.','Ibig sabihin mga o humigit-kumulang.'],'ずつ':['Means each, or a little at a time.','Ibig sabihin tig- o paisa-isa.'],'など':['Means and so on, or such as.','Ibig sabihin at iba pa, o gaya ng.'],'〜です':['Polite way to say is, am or are. Put it after a noun.','Magalang na paraan ng sabihing ay o ako ay. Ilagay pagkatapos ng pangngalan.'],'〜ではありません':['Polite way to say is not.','Magalang na paraan ng sabihing hindi.'],'〜でした':['Polite way to say was.','Magalang na paraan ng sabihing noon ay.'],'〜があります':['Says something is there. Use it for things, not people.','Sinasabing may isang bagay. Para sa bagay, hindi tao.'],'〜がいます':['Says someone is there. Use it for people and animals.','Sinasabing may isang tao o hayop.'],'〜ます':['Polite ending for verbs. It means do or will do.','Magalang na dulo ng pandiwa. Ibig sabihin ginagawa o gagawin.'],'〜ません':['Polite ending for not doing.','Magalang na dulo para sa hindi ginagawa.'],'〜ました':['Polite ending for something already done.','Magalang na dulo para sa nagawa na.'],'〜ましょう':['Means lets do it. You invite someone to do it together.','Ibig sabihin gawin natin. Inaaya mo ang kasama.'],'〜ませんか':['A polite invitation. Means would you like to?','Magalang na pag-aaya. Ibig sabihin gusto mo bang?'],'〜ましょうか':['Offers help. Means shall I do it?','Nag-aalok ng tulong. Ibig sabihin gawin ko ba?'],'〜たいです':['Means want to do. Change ます to たい.','Ibig sabihin gusto kong gawin. Palitan ang ます ng たい.'],'〜て':['A verb form that joins actions and makes many other patterns.','Anyo ng pandiwa na nagdudugtong ng kilos at gumagawa ng maraming pattern.'],'〜ている':['Means is doing now, or a state that continues.','Ibig sabihin ginagawa ngayon, o patuloy na kalagayan.'],'〜てください':['Means please do it. A polite request.','Ibig sabihin pakiusap, paki-gawa. Magalang na hiling.'],'〜ないでください':['Means please do not do it.','Ibig sabihin pakiusap, huwag gawin.'],'〜てもいいです':['Means it is okay to do. Also used to ask permission.','Ibig sabihin pwede gawin. Ginagamit din para humingi ng pahintulot.'],'〜てはいけません':['Means you must not do it.','Ibig sabihin bawal gawin.'],'〜てから':['Means after doing. First one action, then another.','Ibig sabihin pagkatapos gawin. Una ang isa, tapos ang isa pa.'],'〜ない':['The casual way to say do not. Used with friends and family.','Kaswal na paraan ng sabihing hindi gawin. Sa kaibigan at pamilya.'],'〜た':['The casual way to say did. Used with friends and family.','Kaswal na paraan ng sabihing ginawa. Sa kaibigan at pamilya.'],'〜なければなりません':['Means must or have to do.','Ibig sabihin kailangang gawin.'],'〜たことがあります':['Means have done it before. It talks about experience.','Ibig sabihin nagawa na dati. Tungkol sa karanasan.'],'〜たり〜たり':['Gives examples of things you do, like do this and that.','Nagbibigay ng halimbawa ng ginagawa, parang ginagawa ito at iyon.'],'〜に行く':['Means go to do something.','Ibig sabihin pumunta para gumawa ng isang bagay.'],'〜ながら':['Means while doing. Two actions at the same time.','Ibig sabihin habang ginagawa. Dalawang kilos nang sabay.'],'〜前に':['Means before doing.','Ibig sabihin bago gawin.'],'〜と思います':['Means I think that. Used to share an opinion.','Ibig sabihin sa palagay ko. Para sa opinyon.'],'〜でしょう':['Means probably. You are not fully sure.','Ibig sabihin malamang. Hindi ka lubos na sigurado.'],'〜になる':['Means become something.','Ibig sabihin maging isang bagay.'],'〜をください':['Means please give me this. Used to ask for something.','Ibig sabihin pakibigay sa akin. Pang-hingi ng bagay.'],'高い':['Words that end in い describe things. Add です to be polite.','Ang mga salitang nagtatapos sa い ay naglalarawan. Idagdag ang です para maging magalang.'],'〜くない':['Makes an い-word negative. Drop い and add くない.','Ginagawang negatibo ang い-word. Alisin ang い, idagdag ang くない.'],'〜かった':['Makes an い-word past. Drop い and add かった.','Ginagawang nakaraan ang い-word. Alisin ang い, idagdag ang かった.'],'〜くなかった':['Makes an い-word past and negative. Drop い and add くなかった.','Nakaraang negatibo ng い-word. Alisin ang い, idagdag ang くなかった.'],'静かな+noun':['Some describing words need な before a noun.','May mga salitang naglalarawan na kailangan ng な bago ang pangngalan.'],'〜じゃない':['Means is not. Used with nouns and な-words.','Ibig sabihin hindi. Para sa pangngalan at な-words.'],'〜くて/〜で':['Joins two describing words, like and.','Pinagdudugtong ang dalawang salitang naglalarawan, parang at.'],'〜く+verb':['Turns an い-word into how you do something. Drop い and add く.','Ginagawang paraan ng kilos ang い-word. Alisin ang い, idagdag ang く.'],'〜が好きです':['Means like. The thing you like goes before が.','Ibig sabihin gusto. Ang gusto mo ay nasa unahan ng が.'],'〜が上手です':['Means good at something.','Ibig sabihin magaling sa isang bagay.'],'〜がほしいです':['Means want a thing.','Ibig sabihin gusto kong magkaroon ng bagay.'],'〜のほうが〜より':['Compares two things. A is more than B.','Naghahambing ng dalawa. Mas ang A kaysa sa B.'],'〜で一番':['Means the most in a group or place.','Ibig sabihin pinaka sa isang grupo o lugar.'],'あまり〜ない':['Means not very. Always with a not-ending.','Ibig sabihin hindi masyado. Laging may negatibong dulo.'],'ぜんぜん〜ない':['Means not at all. Always with a not-ending.','Ibig sabihin hindi talaga. Laging may negatibong dulo.'],'もう':['Means already. With a not-ending it means no more.','Ibig sabihin na. Kapag negatibo, ibig sabihin wala na.'],'まだ':['Means not yet, or still.','Ibig sabihin hindi pa, o pa rin.'],'Group 1: かく→かきます':['Change the last sound to the い sound, then add ます.','Palitan ang huling tunog sa い na tunog, tapos idagdag ang ます.'],'Group 2: たべる→たべます':['Remove る, then add ます.','Alisin ang る, tapos idagdag ang ます.'],'Group 3: くる・する':['These two change in special ways. Memorize them.','Espesyal ang pagbabago ng dalawang ito. Kabisaduhin.']};
Object.assign(T,{"Dictionary form": ["The dictionary form is the form you find in a dictionary. It always ends in the u sound, like たべる or かく. Every other form is made from it.", "Ito ang anyong makikita sa diksyunaryo. Laging nagtatapos sa tunog na u, tulad ng たべる o かく. Mula rito ginagawa ang lahat ng ibang anyo.", "たべる (taberu) = to eat"], "Group 1 verbs (u-verbs)": ["To conjugate a Group 1 verb, change the last kana to another sound in the same row, then add the ending.", "Sa Group 1, palitan ang huling kana ng ibang tunog sa parehong hanay, tapos idagdag ang hulapi.", "のむ → のみます, のまない"], "Group 2 verbs (ru-verbs)": ["Group 2 verbs end in いる or える. Drop る and add the ending.", "Ang Group 2 ay nagtatapos sa いる o える. Alisin ang る at idagdag ang hulapi.", "みる → みます, みない"], "Group 3 verbs (irregular)": ["Only two verbs are irregular: くる (come) and する (do). They change in special ways, so memorize them. Words like べんきょうする follow する.", "Dalawa lang ang irregular: くる (dumating) at する (gawin). Espesyal ang pagbabago nila kaya kabisaduhin. Ang tulad ng べんきょうする ay sumusunod sa する.", "くる → きます, こない / する → します, しない"], "How to tell the group": ["If a verb ends in いる or える, it is usually Group 2. Every other verb is Group 1. くる and する are Group 3.", "Kung nagtatapos sa いる o える, kadalasan ay Group 2. Lahat ng iba ay Group 1. Ang くる at する ay Group 3.", "たべる (eat) = Group 2, のむ (drink) = Group 1"], "Look-alike verbs": ["A few Group 1 verbs end in いる or える, so they look like Group 2. Memorize them: かえる (return), はいる (enter), はしる (run), しる (know), きる (cut).", "May ilang Group 1 na nagtatapos sa いる o える kaya mukhang Group 2. Kabisaduhin: かえる (bumalik), はいる (pumasok), はしる (tumakbo), しる (malaman), きる (putulin).", "かえる → かえります (not かえます)"], "う→い: かう→かいます": ["For Group 1 verbs ending in う, change う to い and add ます. This makes the polite form.", "Sa Group 1 na nagtatapos sa う, palitan ang う ng い at idagdag ang ます. Ito ang magalang na anyo.", "かう → かいます (buy)"], "く→き: かく→かきます": ["For Group 1 verbs ending in く, change く to き and add ます. This makes the polite form.", "Sa Group 1 na nagtatapos sa く, palitan ang く ng き at idagdag ang ます. Ito ang magalang na anyo.", "かく → かきます (write)"], "ぐ→ぎ: およぐ→およぎます": ["For Group 1 verbs ending in ぐ, change ぐ to ぎ and add ます. This makes the polite form.", "Sa Group 1 na nagtatapos sa ぐ, palitan ang ぐ ng ぎ at idagdag ang ます. Ito ang magalang na anyo.", "およぐ → およぎます (swim)"], "す→し: はなす→はなします": ["For Group 1 verbs ending in す, change す to し and add ます. This makes the polite form.", "Sa Group 1 na nagtatapos sa す, palitan ang す ng し at idagdag ang ます. Ito ang magalang na anyo.", "はなす → はなします (speak)"], "つ→ち: まつ→まちます": ["For Group 1 verbs ending in つ, change つ to ち and add ます. This makes the polite form.", "Sa Group 1 na nagtatapos sa つ, palitan ang つ ng ち at idagdag ang ます. Ito ang magalang na anyo.", "まつ → まちます (wait)"], "ぬ→に: しぬ→しにます": ["For Group 1 verbs ending in ぬ, change ぬ to に and add ます. This makes the polite form.", "Sa Group 1 na nagtatapos sa ぬ, palitan ang ぬ ng に at idagdag ang ます. Ito ang magalang na anyo.", "しぬ → しにます (die)"], "ぶ→び: あそぶ→あそびます": ["For Group 1 verbs ending in ぶ, change ぶ to び and add ます. This makes the polite form.", "Sa Group 1 na nagtatapos sa ぶ, palitan ang ぶ ng び at idagdag ang ます. Ito ang magalang na anyo.", "あそぶ → あそびます (play)"], "む→み: のむ→のみます": ["For Group 1 verbs ending in む, change む to み and add ます. This makes the polite form.", "Sa Group 1 na nagtatapos sa む, palitan ang む ng み at idagdag ang ます. Ito ang magalang na anyo.", "のむ → のみます (drink)"], "る→り: のる→のります": ["For Group 1 verbs ending in る, change る to り and add ます. This makes the polite form.", "Sa Group 1 na nagtatapos sa る, palitan ang る ng り at idagdag ang ます. Ito ang magalang na anyo.", "のる → のります (ride)"], "Group 2 (ます): たべる→たべます": ["For Group 2 verbs, drop る and add ます.", "Sa Group 2, alisin ang る at idagdag ang ます.", "たべる → たべます, みる → みます"], "Irregular: くる→きます": ["くる changes to きます.", "Ang くる ay nagiging きます.", "くる → きます"], "Irregular: する→します": ["する changes to します.", "Ang する ay nagiging します.", "する → します, べんきょうする → べんきょうします"], "ます→ません": ["To make the polite negative, change ます to ません.", "Para sa magalang na negatibo, palitan ang ます ng ません.", "かきます → かきません (do not write)"], "ます→ました": ["To make the polite past, change ます to ました.", "Para sa magalang na nakaraan, palitan ang ます ng ました.", "かきます → かきました (wrote)"], "ます→ませんでした": ["To make the polite past negative, change ます to ませんでした.", "Para sa magalang na negatibong nakaraan, palitan ang ます ng ませんでした.", "かきます → かきませんでした (did not write)"], "う→わ: かう→かわない": ["For Group 1 verbs ending in う, change う to わ (not あ) and add ない.", "Sa Group 1 na nagtatapos sa う, palitan ang う ng わ (hindi あ) at idagdag ang ない.", "かう → かわない (buy)"], "く→か: かく→かかない": ["For Group 1 verbs ending in く, change く to か and add ない. This makes the plain negative.", "Sa Group 1 na nagtatapos sa く, palitan ang く ng か at idagdag ang ない. Ito ang plain na negatibo.", "かく → かかない (write)"], "ぐ→が: およぐ→およがない": ["For Group 1 verbs ending in ぐ, change ぐ to が and add ない. This makes the plain negative.", "Sa Group 1 na nagtatapos sa ぐ, palitan ang ぐ ng が at idagdag ang ない. Ito ang plain na negatibo.", "およぐ → およがない (swim)"], "す→さ: はなす→はなさない": ["For Group 1 verbs ending in す, change す to さ and add ない. This makes the plain negative.", "Sa Group 1 na nagtatapos sa す, palitan ang す ng さ at idagdag ang ない. Ito ang plain na negatibo.", "はなす → はなさない (speak)"], "つ→た: まつ→またない": ["For Group 1 verbs ending in つ, change つ to た and add ない. This makes the plain negative.", "Sa Group 1 na nagtatapos sa つ, palitan ang つ ng た at idagdag ang ない. Ito ang plain na negatibo.", "まつ → またない (wait)"], "ぬ→な: しぬ→しなない": ["For Group 1 verbs ending in ぬ, change ぬ to な and add ない. This makes the plain negative.", "Sa Group 1 na nagtatapos sa ぬ, palitan ang ぬ ng な at idagdag ang ない. Ito ang plain na negatibo.", "しぬ → しなない (die)"], "ぶ→ば: あそぶ→あそばない": ["For Group 1 verbs ending in ぶ, change ぶ to ば and add ない. This makes the plain negative.", "Sa Group 1 na nagtatapos sa ぶ, palitan ang ぶ ng ば at idagdag ang ない. Ito ang plain na negatibo.", "あそぶ → あそばない (play)"], "む→ま: のむ→のまない": ["For Group 1 verbs ending in む, change む to ま and add ない. This makes the plain negative.", "Sa Group 1 na nagtatapos sa む, palitan ang む ng ま at idagdag ang ない. Ito ang plain na negatibo.", "のむ → のまない (drink)"], "る→ら: のる→のらない": ["For Group 1 verbs ending in る, change る to ら and add ない. This makes the plain negative.", "Sa Group 1 na nagtatapos sa る, palitan ang る ng ら at idagdag ang ない. Ito ang plain na negatibo.", "のる → のらない (ride)"], "Group 2: たべる→たべない": ["For Group 2 verbs, drop る and add ない.", "Sa Group 2, alisin ang る at idagdag ang ない.", "たべる → たべない, みる → みない"], "Irregular: くる→こない": ["くる changes to こない.", "Ang くる ay nagiging こない.", "くる → こない"], "Irregular: する→しない": ["する changes to しない.", "Ang する ay nagiging しない.", "する → しない"], "ある→ない (exception)": ["ある (there is) is an exception. Its negative is just ない, not あらない.", "Ang ある ay exception. Ang negatibo nito ay ない lang, hindi あらない.", "ある → ない"], "ない→なかった": ["To make the plain past negative, change ない to なかった.", "Para sa plain na negatibong nakaraan, palitan ang ない ng なかった.", "かかない → かかなかった (did not write)"], "た-form rule": ["The plain past (た-form) follows the same pattern as the て-form. Just use た instead of て, and だ instead of で.", "Ang plain na nakaraan (た-form) ay kapareho ng pattern ng て-form. Gamitin ang た sa halip na て, at だ sa halip na で.", "かって → かった, のんで → のんだ"], "う・つ・る→った: かう→かった": ["For Group 1 verbs ending in う, つ or る, change the ending to った.", "Sa Group 1 na nagtatapos sa う, つ o る, palitan ang hulihan ng った.", "かう → かった / まつ → まった / のる → のった"], "む・ぶ・ぬ→んだ: のむ→のんだ": ["For Group 1 verbs ending in む, ぶ or ぬ, change the ending to んだ.", "Sa Group 1 na nagtatapos sa む, ぶ o ぬ, palitan ang hulihan ng んだ.", "のむ → のんだ / あそぶ → あそんだ / しぬ → しんだ"], "く→いた: かく→かいた": ["For Group 1 verbs ending in く, change く to いた.", "Sa Group 1 na nagtatapos sa く, palitan ang く ng いた.", "かく → かいた"], "ぐ→いだ: およぐ→およいだ": ["For Group 1 verbs ending in ぐ, change ぐ to いだ.", "Sa Group 1 na nagtatapos sa ぐ, palitan ang ぐ ng いだ.", "およぐ → およいだ"], "す→した: はなす→はなした": ["For Group 1 verbs ending in す, change す to した.", "Sa Group 1 na nagtatapos sa す, palitan ang す ng した.", "はなす → はなした"], "いく→いった (exception)": ["いく is an exception. Its past is いった, not いいた.", "Ang いく ay exception. Ang nakaraan nito ay いった, hindi いいた.", "いく → いった"], "Group 2: たべる→たべた": ["For Group 2 verbs, drop る and add た.", "Sa Group 2, alisin ang る at idagdag ang た.", "たべる → たべた, みる → みた"], "Irregular: くる→きた": ["くる changes to きた.", "Ang くる ay nagiging きた.", "くる → きた"], "Irregular: する→した": ["する changes to した.", "Ang する ay nagiging した.", "する → した"], "Group 2: たべる→たべて": ["For Group 2 verbs, drop る and add て.", "Sa Group 2, alisin ang る at idagdag ang て.", "たべる → たべて, みる → みて"], "Irregular: くる→きて": ["くる changes to きて.", "Ang くる ay nagiging きて.", "くる → きて"], "Irregular: する→して": ["する changes to して.", "Ang する ay nagiging して.", "する → して"], "ない→なくて": ["To say not doing and then something else, change ない to なくて.", "Para sabihing hindi ginagawa at may kasunod, palitan ang ない ng なくて.", "かかない → かかなくて"], "Table: かう (buy)": ["Group 1 verb ending in う. ます: う to い and add ます. ない: う to わ and add ない. た: う to った. て: う to って.", "Group 1 na pandiwa na nagtatapos sa う. ます: う ay い + ます. ない: う ay わ + ない. た: う ay った. て: う ay って."], "Table: かく (write)": ["Group 1 verb ending in く. ます: く to き and add ます. ない: く to か and add ない. た: く to いた. て: く to いて.", "Group 1 na pandiwa na nagtatapos sa く. ます: く ay き + ます. ない: く ay か + ない. た: く ay いた. て: く ay いて."], "Table: およぐ (swim)": ["Group 1 verb ending in ぐ. ます: ぐ to ぎ and add ます. ない: ぐ to が and add ない. た: ぐ to いだ. て: ぐ to いで.", "Group 1 na pandiwa na nagtatapos sa ぐ. ます: ぐ ay ぎ + ます. ない: ぐ ay が + ない. た: ぐ ay いだ. て: ぐ ay いで."], "Table: はなす (speak)": ["Group 1 verb ending in す. ます: す to し and add ます. ない: す to さ and add ない. た: す to した. て: す to して.", "Group 1 na pandiwa na es し before ます, ない, た and て.", "Group 3 (irregular). Ang する ay nagiging し bago ang ます, ない, た at て."], "Table: ある (there is)": ["Group 1 verb with an irregular negative. The negative is just ない.", "Group 1 na may irregular na negatibo. Ang negatibo ay ない lang."], "Table: いく (go)": ["Group 1 verb with an irregular past and te-form. Use いった and いって, not いいた and いいて.", "Group 1 na may irregular na nakaraan at て-form. Gamitin ang いった at いって, hindi いいた at いいて."]});

Object.assign(T,{'〜ではありませんでした':['Polite way to say was not.','Magalang na paraan ng sabihing hindi noon.','あめでは ありませんでした (ame dewa arimasen deshita) = It was not rain.'],'これ/それ/あれ':['Words for things. これ is near me, それ is near you, あれ is far from both.','Salita para sa bagay. これ ay malapit sa akin, それ ay malapit sa iyo, あれ ay malayo sa dalawa.','これは りんご です (kore wa ringo desu) = This is an apple.'],'この/その/あの':['Same as これ/それ/あれ but they go before a noun.','Kapareho ng これ/それ/あれ pero nasa unahan ng pangngalan.','この ほんは おもしろい です (kono hon wa omoshiroi desu) = This book is interesting.'],'ここ/そこ/あそこ':['Words for places. ここ is here, そこ is there, あそこ is over there.','Salita para sa lugar. ここ ay dito, そこ ay diyan, あそこ ay doon.','ここは えき です (koko wa eki desu) = This is the station.'],'〜ませんでした':['Polite ending for did not do.','Magalang na dulo para sa hindi ginawa.','きのう たべませんでした (kinou tabemasen deshita) = I did not eat yesterday.'],'いつも':['Means always.','Ibig sabihin palagi.','いつも あさ コーヒーを のみます (itsumo asa koohii o nomimasu) = I always drink coffee in the morning.'],'よく':['Means often.','Ibig sabihin madalas.','よく えいがを みます (yoku eiga o mimasu) = I often watch movies.'],'ときどき':['Means sometimes.','Ibig sabihin paminsan-minsan.','ときどき さんぽします (tokidoki sanpo shimasu) = I sometimes take a walk.'],'とても':['Means very.','Ibig sabihin sobra o napaka.','とても おいしい です (totemo oishii desu) = It is very delicious.'],'ちょっと':['Means a little. Also a soft way to say no.','Ibig sabihin kaunti. Magalang din na paraan ng pagtanggi.','ちょっと まって ください (chotto matte kudasai) = Please wait a little.'],'何':['Means what. Read as なに or なん.','Ibig sabihin ano. Binabasa bilang なに o なん.','これは なん ですか (kore wa nan desuka) = What is this?'],'誰':['Means who. Read as だれ.','Ibig sabihin sino. Binabasa bilang だれ.','あの ひとは だれ ですか (ano hito wa dare desuka) = Who is that person?'],'どこ':['Means where.','Ibig sabihin saan.','トイレは どこ ですか (toire wa doko desuka) = Where is the toilet?'],'どう':['Means how.','Ibig sabihin paano o kumusta.','テストは どう でしたか (tesuto wa dou deshitaka) = How was the test?'],'どうして':['Means why.','Ibig sabihin bakit.','どうして なきましたか (doushite nakimashitaka) = Why did you cry?'],'どのくらい':['Means how long or how much.','Ibig sabihin gaano katagal o gaano karami.','どのくらい かかりますか (dono kurai kakarimasuka) = How long does it take?'],'〜は〜です':['The basic sentence: A is B.','Pangunahing pangungusap: ang A ay B.','これは りんご です (kore wa ringo desu) = This is an apple.'],'〜は〜ではありません':['The basic negative sentence: A is not B.','Negatibong pangungusap: ang A ay hindi B.','これは みかん では ありません (kore wa mikan dewa arimasen) = This is not a mandarin.'],'〜も':['Means also. Use it in place of は.','Ibig sabihin din. Ipalit sa は.','わたしも がくせい です (watashi mo gakusei desu) = I am a student too.'],'〜と〜':['Joins two nouns with and.','Pinagdudugtong ang dalawang pangngalan gamit ang at.','パンと たまごを かいました (pan to tamago o kaimashita) = I bought bread and eggs.'],'〜か〜':['Joins two choices with or.','Pinagdudugtong ang dalawang pagpipilian gamit ang o.','コーヒーか おちゃを のみます (koohii ka ocha o nomimasu) = I will drink coffee or tea.'],'〜から〜まで':['Means from A to B. Works for time and places.','Ibig sabihin mula A hanggang B. Para sa oras at lugar.','9じから 5じまで はたらきます (kuji kara goji made hatarakimasu) = I work from 9 to 5.'],'〜に〜があります':['Says there is a thing at a place. Place first, then thing.','Sinasabing may bagay sa isang lugar. Una ang lugar, tapos ang bagay.','へやに テレビが あります (heya ni terebi ga arimasu) = There is a TV in the room.'],'〜は〜にあります':['Says where a thing is. Thing first, then place.','Sinasabi kung nasaan ang bagay. Una ang bagay, tapos ang lugar.','えきは あそこに あります (eki wa asoko ni arimasu) = The station is over there.'],'〜は〜にいます':['Says where a person or animal is.','Sinasabi kung nasaan ang tao o hayop.','せんせいは きょうしつに います (sensei wa kyoushitsu ni imasu) = The teacher is in the classroom.'],'〜で〜をします':['Says what you do and where you do it.','Sinasabi kung ano ang ginagawa at saan.','としょかんで べんきょうを します (toshokan de benkyou o shimasu) = I study at the library.'],'〜に〜をあげます':['Means give something to someone.','Ibig sabihin magbigay ng bagay sa isang tao.','ともだちに プレゼントを あげます (tomodachi ni purezento o agemasu) = I give a present to a friend.'],'〜に〜をもらいます':['Means receive something from someone.','Ibig sabihin tumanggap ng bagay mula sa isang tao.','ちちに とけいを もらいました (chichi ni tokei o moraimashita) = I got a watch from my father.'],'〜の〜':['Links two nouns. A の B means B of A.','Pinagdudugtong ang dalawang pangngalan. A の B ay B ng A.','にほんごの ほん (nihongo no hon) = a Japanese language book'],'〜は〜より〜です':['Compares two things. A is more than B.','Naghahambing ng dalawa. Mas ang A kaysa sa B.','バスより でんしゃが はやい です (basu yori densha ga hayai desu) = Trains are faster than buses.'],'〜と〜とどちらが〜ですか':['Asks which of two is more. Used for choosing.','Nagtatanong kung alin sa dalawa ang mas. Para sa pagpili.','コーヒーと おちゃと どちらが すき ですか (koohii to ocha to dochira ga suki desuka) = Which do you like more, coffee or tea?'],'〜のなかで〜がいちばん〜です':['Means the most among a group.','Ibig sabihin pinaka sa isang grupo.','くだものの なかで りんごが いちばん すき です (kudamono no naka de ringo ga ichiban suki desu) = Among fruits, I like apples the most.'],'〜は〜が〜です':['Says what part of A has a quality. A is the topic, B is the part.','Sinasabi kung anong bahagi ng A ang may katangian.','わたしは あたまが いたい です (watashi wa atama ga itai desu) = I have a headache.'],'〜がすきです':['Means like. Same as 〜が好きです.','Ibig sabihin gusto. Kapareho ng 〜が好きです.','おんがくが すき です (ongaku ga suki desu) = I like music.'],'〜てもいいですか':['Asks permission. Means may I do it?','Humihingi ng pahintulot. Ibig sabihin pwede ko bang gawin?','ここに すわっても いい ですか (koko ni suwattemo ii desuka) = May I sit here?'],'〜に行きます':['Means go to do something. Verb stem + に行きます.','Ibig sabihin pumunta para gumawa. Ugat ng pandiwa + に行きます.','かいものに いきます (kaimono ni ikimasu) = I go shopping.'],'〜がいいです':['Means I prefer it, or it is good.','Ibig sabihin mas gusto ko ito, o maganda ito.','おちゃが いい です (ocha ga ii desu) = Tea is good for me.'],'〜て、〜':['Joins actions in order. Do this, then that.','Pinagdudugtong ang kilos ayon sa pagkakasunod. Una ito, tapos iyon.','おきて、 あらいます (okite, araimasu) = I wake up and wash.'],'〜から':['Means because. The reason comes first.','Ibig sabihin dahil. Nauuna ang dahilan.','あついから まどを あけます (atsui kara mado o akemasu) = Because it is hot, I open the window.'],'〜が':['Means but. It joins two opposite ideas.','Ibig sabihin pero. Pinagdudugtong ang dalawang magkasalungat.','たかい ですが おいしい です (takai desuga oishii desu) = It is expensive but delicious.'],'〜けど':['Means but. The casual form of が.','Ibig sabihin pero. Kaswal na anyo ng が.','たかいけど かいます (takaikedo kaimasu) = It is expensive but I will buy it.'],'〜とき':['Means when. Says the time something happens.','Ibig sabihin kapag o noong. Sinasabi ang oras ng nangyari.','ひまな とき えいがを みます (hima na toki eiga o mimasu) = When I am free, I watch movies.'],'〜まえに':['Means before doing. Use the dictionary form + まえに.','Ibig sabihin bago gawin. Dictionary form + まえに.','ねる まえに はを みがきます (neru mae ni ha o migakimasu) = I brush my teeth before sleeping.'],'〜あとで':['Means after doing. Use the past form + あとで.','Ibig sabihin pagkatapos gawin. Past form + あとで.','たべた あとで ねます (tabeta ato de nemasu) = I sleep after eating.'],'〜まで':['Means until. Time or place.','Ibig sabihin hanggang. Oras o lugar.','えきまで あるきます (eki made arukimasu) = I walk to the station.'],'〜たり〜たりします':['Gives examples of things you do, like do this and that.','Nagbibigay ng halimbawa ng ginagawa.','よんだり かいたり します (yondari kaitari shimasu) = I do things like reading and writing.'],'〜ことがあります':['Means have done it before. Use the past form + ことがあります.','Ibig sabihin nagawa na dati. Past form + ことがあります.','ひこうきに のった ことが あります (hikouki ni notta koto ga arimasu) = I have ridden an airplane.'],'〜う・つ・る→〜って':['te-form rule: a verb ending in う, つ or る changes to って.','Patakaran sa te-form: ang pandiwang nagtatapos sa う, つ o る ay nagiging って.','かう → かって (kau, katte) = buy'],'〜む・ぶ・ぬ→〜んで':['te-form rule: a verb ending in む, ぶ or ぬ changes to んで.','Patakaran sa te-form: ang nagtatapos sa む, ぶ o ぬ ay nagiging んで.','のむ → のんで (nomu, nonde) = drink'],'〜く→〜いて':['te-form rule: a verb ending in く changes to いて.','Patakaran sa te-form: ang nagtatapos sa く ay nagiging いて.','かく → かいて (kaku, kaite) = write'],'〜ぐ→〜いで':['te-form rule: a verb ending in ぐ changes to いで.','Patakaran sa te-form: ang nagtatapos sa ぐ ay nagiging いで.','およぐ → およいで (oyogu, oyoide) = swim'],'〜す→〜して':['te-form rule: a verb ending in す changes to して.','Patakaran sa te-form: ang nagtatapos sa す ay nagiging して.','はなす → はなして (hanasu, hanashite) = speak'],'いく→いって':['An exception. いく becomes いって, not いいて.','Eksepsyon ito. Ang いく ay いって, hindi いいて.','いく → いって (iku, itte) = go'],'Dictionary form: たべる':['The basic form of a verb, as found in a dictionary. Also the casual present.','Ang pangunahing anyo ng pandiwa sa diksyunaryo. Kaswal na kasalukuyan din.','たべる (taberu) = to eat'],'ない form: たべない':['Add ない to make a verb negative in casual speech.','Idagdag ang ない para gawing negatibo ang pandiwa sa kaswal na usapan.','たべない (tabenai) = do not eat'],'た form: たべた':['The casual past of a verb. Same rule as the te-form but with た.','Kaswal na nakaraan ng pandiwa. Kapareho ng te-form pero may た.','たべた (tabeta) = ate'],'〜くなります':['Means become. Drop い from an い-word and add くなります.','Ibig sabihin maging. Alisin ang い at idagdag ang くなります.','さむく なります (samuku narimasu) = It becomes cold.'],'〜になります':['Means become. Use it with nouns and な-words.','Ibig sabihin maging. Para sa pangngalan at な-words.','せんせいに なります (sensei ni narimasu) = I will become a teacher.'],'〜くします':['Means make something that way. Drop い and add くします.','Ibig sabihin gawing ganoon. Alisin ang い at idagdag ang くします.','おとを おおきく します (oto o ookiku shimasu) = I make the sound louder.'],'〜だ':['The casual way to say is, am or are.','Kaswal na paraan ng sabihing ay o ako ay.','わたしは がくせいだ (watashi wa gakusei da) = I am a student.'],'〜だった':['The casual way to say was.','Kaswal na paraan ng sabihing noon ay.','きのうは あめだった (kinou wa ame datta) = Yesterday was rainy.'],'どんな〜ですか':['Asks what kind of something it is.','Nagtatanong kung anong klase ng bagay.','どんな たべものが すき ですか (donna tabemono ga suki desuka) = What kind of food do you like?'],'〜ですね':['Means is it not. Used to agree with someone.','Ibig sabihin diba. Para sumang-ayon.','あつい ですね (atsui desu ne) = It is hot, is it not?'],'〜ですよ':['Used to say something firmly. Means you know.','Pang-diin kapag may sinasabi. Parang alam mo.','だいじょうぶ ですよ (daijoubu desu yo) = It is okay, I tell you.'],'〜は何ですか':['Asks what something is.','Nagtatanong kung ano ang isang bagay.','これは なん ですか (kore wa nan desuka) = What is this?'],'〜は何時ですか':['Asks what time something is.','Nagtatanong kung anong oras.','いま なんじ ですか (ima nanji desuka) = What time is it now?'],'何人ですか':['Asks how many people.','Nagtatanong kung ilang tao.','なんにん ですか (nannin desuka) = How many people are there?'],'何歳ですか':['Asks how old someone is.','Nagtatanong kung ilang taon.','なんさい ですか (nansai desuka) = How old are you?'],'〜はいくらですか':['Asks how much something costs.','Nagtatanong kung magkano.','これは いくら ですか (kore wa ikura desuka) = How much is this?'],'〜はどうですか':['Asks how something is, or offers a suggestion.','Nagtatanong kung kumusta, o nagmumungkahi.','コーヒーは どう ですか (koohii wa dou desuka) = How about some coffee?'],'〜はだれですか':['Asks who someone is.','Nagtatanong kung sino.','あの ひとは だれ ですか (ano hito wa dare desuka) = Who is that person?']});

el.innerHTML=`<h2>Writing tutorial: how to write kana correctly</h2><div class="q" style="text-align:left"><b>Stroke order rules</b><br>1. Top to bottom.<br>2. Left to right.<br>3. When two strokes cross, horizontal first, then vertical.<br>4. Write the main center stroke before small side strokes.<br>5. Dots and small ticks usually come last.<br><br><b>Proportion and spacing</b><br>- Imagine every kana inside the same square, so all letters look equal in size.<br>- Hiragana is round and flowing; katakana is straight and angular.<br>- Small kana (ゃ ゅ ょ っ) are about 70% size and sit at the lower left.<br>- Keep even gaps between letters. Do not squeeze or stretch.<br>- Watch the endings: stop (とめ), flick (はね), sweep (はらい).<br><br><b>Look-alikes to practice</b><br>さ / ち, ぬ / め, る / ろ, わ / れ / ね, は / ほ, シ / ツ, ソ / ン, ノ / リ</div><h2>Practice pad</h2><div class="bar"><button data-s="h" class="${H?'on':''}">Hiragana</button><button data-s="k" class="${H?'':'on'}">Katakana</button></div><div class="g" style="grid-template-columns:repeat(auto-fill,minmax(46px,1fr))">${list.map(c=>`<button data-c="${c}" class="${c==wc?'on':''}">${c}</button>`).join('')}</div><div class="q" style="margin-top:10px"><div class="s">${wc} · ${rm(wc)} · ${SC[wc]||'?'} strokes (standard handwriting)</div><div style="position:relative;width:260px;height:260px;margin:8px auto;border:2px solid var(--bd);background-image:linear-gradient(var(--bd) 1px,transparent 1px),linear-gradient(90deg,var(--bd) 1px,transparent 1px);background-size:100% 50%,50% 100%"><div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:190px;opacity:${gd?.18:0};pointer-events:none">${wc}</div><canvas width="260" height="260" style="position:absolute;inset:0;touch-action:none"></canvas></div><button id="cl" style="display:inline-block;width:auto">Clear</button> <button id="gt" style="display:inline-block;width:auto">Show/hide guide</button><div class="s">Trace the faint kana in the correct stroke order, then try writing it without the guide.</div></div>`;
el.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{ws=b.dataset.s;wc=ws=='h'?'あ':'ア';tut()});el.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{wc=b.dataset.c;tut()});
const cv=el.querySelector('canvas'),x=cv.getContext('2d');x.lineWidth=8;x.lineCap='round';x.lineJoin='round';x.strokeStyle='#c2410c';let d=0;const P=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
cv.onpointerdown=e=>{d=1;cv.setPointerCapture(e.pointerId);x.beginPath();x.moveTo(...P(e))};cv.onpointermove=e=>{if(d){x.lineTo(...P(e));x.stroke()}};cv.onpointerup=()=>{d=0};
el.querySelector('#cl').onclick=()=>x.clearRect(0,0,260,260);el.querySelector('#gt').onclick=()=>{gd=!gd;tut()}}
const D={kanji:K,kana:KA,vocab:V,grammar:G,phrases:PH};let tab="kanji",test=false,qm=false,L={};
try{L=JSON.parse(localStorage.getItem("n5")||"{}")}catch(e){}
const sv=()=>{try{localStorage.setItem("n5",JSON.stringify(L))}catch(e){}};
const items=t=>Object.entries(D[t]).flatMap(([c,s])=>s.split("|").map(x=>{const e=x.indexOf("=");const R=h=>(t=="vocab"||t=="grammar")&&rm(h,t=="grammar")?rm(h,t=="grammar")+" · ":"";if(e>0)return{c,h:x.slice(0,e),s:R(x.slice(0,e))+x.slice(e+1)};const p=x.split(" ");return t=="kanji"?{c,h:p[0],s:p[1]+" · "+p.slice(2).join(" ")}:{c,h:p[0],s:R(p[0])+p.slice(1).join(" ").replace(/-/g," ")}}));
function pg(){const n=Object.keys(D).reduce((a,t)=>a+items(t).length,0);document.getElementById("pg").textContent=Object.keys(L).length+" of "+n+" items learned. Tap ✓ on a card to mark it, 🔊 to hear it.";const p=document.getElementById("pb");p.max=n;p.value=Object.keys(L).length}
function show(){const o=document.getElementById("out"),f=document.getElementById("sr").value.toLowerCase();
if(qm)return quiz();if(tab=="write")return tut();if(fc)return flash();
let h=tab=="grammar"?"<p class=s>Tap a card to see the explanation (English and Tagalog) and an example.</p>":tab=="kana"?"<div class='q' id='pp'></div>":"";const all=items(tab);const cats=[...new Set(all.map(i=>i.c))];
for(const c of cats){const l=all.filter(i=>i.c==c&&(i.h+i.s).toLowerCase().includes(f));if(!l.length)continue;
h+=`<h2>${c} (${l.length})</h2><div class="g ${tab=="kanji"||tab=="kana"?"k":""} ${tab=="phrases"||tab=="grammar"?"w":""} ${test?"t":""}">`+l.map(i=>`<div class="c ${L[i.h]?"l":""}" data-h="${i.h}"><div class="h">${i.h}</div><div class="s">${i.s}</div>${X(i)?`<div class="e">${X(i)}</div>`:""}<div class="b"><span data-say="${i.h}">🔊</span><span data-l="${i.h}">✓</span></div></div>`).join("")+"</div>"}
o.innerHTML=h||"<p>No matches.</p>";pg();if(tab=="kana")pp()}
document.getElementById("out").addEventListener("click",e=>{const t=e.target,c=t.closest(".c");if(t.dataset&&t.dataset.sp){speakEx(t.dataset.sp,t.dataset.k);return}if(t.dataset&&t.dataset.say){say(t.dataset.say);return}if(t.dataset&&t.dataset.l){const h=t.dataset.l;L[h]?delete L[h]:L[h]=1;sv();c.classList.toggle("l");pg();return}if(c){c.classList.toggle("o");if(tab=="kana"){wc=c.dataset.h;pp();document.getElementById("pp").scrollIntoView({block:"nearest"})}}});
document.getElementById("out").addEventListener("dblclick",e=>{const c=e.target.closest(".c");if(!c)return;const h=c.dataset.h;L[h]?delete L[h]:L[h]=1;sv();c.classList.toggle("l");pg()});
let qs={n:0,s:0},qk=null;const pool=k=>{const a=items(k=="hira"||k=="kata"?"kana":k);return k=="hira"?a.filter(i=>i.c[0]=="H"):k=="kata"?a.filter(i=>i.c[0]=="K"):a};
function menu(){const el=document.getElementById("out");el.innerHTML="<h2>Choose a quiz</h2><div class=g>"+[["hira","Hiragana Quiz"],["kata","Katakana Quiz"],["kanji","Kanji Quiz"],["vocab","Vocab Quiz"],["grammar","Grammar Quiz"],["phrases","Phrases Quiz"]].map(([k,n])=>`<button data-q="${k}">${n}</button>`).join("")+"</div>";el.querySelectorAll("button").forEach(b=>b.onclick=()=>{qk=b.dataset.q;qs={n:0,s:0};quiz()})}
function quiz(){if(!qm)return;if(!qk){menu();return}const a=pool(qk),i=a[Math.random()*a.length|0];let o=[i.s];while(o.length<4){const s=a[Math.random()*a.length|0].s;if(!o.includes(s))o.push(s)}
o.sort(()=>Math.random()-.5);const el=document.getElementById("out");
el.innerHTML=`<div class="q"><div class="s" id="bk" style="cursor:pointer">← All quizzes</div><div class="s">Score ${qs.s}/${qs.n}</div><div class="h">${i.h}</div>`+o.map(x=>`<button>${x}</button>`).join("")+"</div>";
el.querySelector("#bk").onclick=()=>{qk=null;menu()};el.querySelectorAll("button").forEach(b=>b.onclick=()=>{qs.n++;const r=b.textContent==i.s;if(r)qs.s++;b.classList.add(r?"ok":"no");el.querySelectorAll("button").forEach(x=>{x.disabled=1;if(x.textContent==i.s)x.classList.add("ok")});setTimeout(quiz,900)})}
const tb=document.getElementById("tabs");
[["kanji","Kanji (100)"],["kana","Hiragana & Katakana"],["vocab","Vocab"],["grammar","Grammar"],["phrases","Phrases"],["write","Writing Tutorial"],["quiz","Quiz"]].forEach(([k,n])=>{const b=document.createElement("button");b.textContent=n;b.dataset.k=k;b.onclick=()=>{if(k=="quiz"){qm=true;qk=null}else{qm=false;tab=k}tb.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x==b||(qm&&x.dataset.k=="quiz")));if(qm)tb.querySelector(`[data-k=${tab}]`).classList.add("on");show()};tb.append(b)});
tb.firstChild.classList.add("on");
document.getElementById("sr").oninput=show;
document.getElementById("tm").onclick=function(){test=!test;this.classList.toggle("on",test);show()};document.getElementById("fm").onclick=function(){fc=!fc;this.classList.toggle("on",fc);show()};
show();
</script></body></html>
