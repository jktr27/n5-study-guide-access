<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Admin</title>
<style>body{font-family:system-ui;padding:14px;max-width:560px;margin:auto}.r{border:1px solid #8885;border-radius:10px;padding:10px;margin:8px 0}
button{padding:8px 12px;margin:4px 4px 0 0;border-radius:8px;border:0;background:#00b8c8;color:#fff}button.x{background:#d44}input{padding:10px;width:100%;box-sizing:border-box}
.lg{font-size:13px;margin-top:6px;padding:6px;background:#8881;border-radius:8px}.bad{color:#d33}.ok{color:#2a7}</style></head>
<body><h2>Seller Admin</h2><input id="p" type="password" placeholder="Admin password" autocomplete="current-password"><label style="display:block;margin:8px 0;font-size:14px"><input id="rm" type="checkbox" style="width:auto;margin-right:6px">Remember password on this device</label><button onclick="load()">Load</button><button class="x" onclick="logout()">Log out</button><div id="o"></div><h3>Reviews</h3><div id="rv"></div>
<script>
const p=()=>document.getElementById("p").value,rm=()=>document.getElementById("rm").checked;
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
function logout(){ls.del("apw");document.getElementById("p").value="";document.getElementById("rm").checked=false;document.getElementById("o").innerHTML="";document.getElementById("rv").innerHTML=""}
async function call(a,b={}){return(await fetch("/api/admin/"+a,{method:"POST",body:JSON.stringify({password:p(),...b})})).json()}
async function act(a,id){await call(a,{id});load()}
async function rev(a,key){await call(a,{key});load()}
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const tm=t=>t?new Date(t).toLocaleString():"-";
function dev(r){const i=r.info;if(!r.key)return"";
 let h=`<div class=lg><b>Device:</b> ${i&&i.bound?esc(i.bound.d)+" · IP "+esc(i.bound.ip||"?")+"<br>First used: "+tm(i.boundAt):"not yet used"}`;
 if(i){h+=`<br><b>Logins:</b> ${i.logins} · <b>Last seen:</b> ${tm(i.lastSeen)} · <b class="${i.blocked?"bad":""}">Blocked attempts: ${i.blocked}</b>`;
 if(i.log.length)h+="<br><br>"+i.log.map(e=>`<span class="${e.ok?"ok":"bad"}">${e.ok?"✅":"⛔"}</span> ${tm(e.t)}<br>&nbsp;&nbsp;${esc(e.d||"")} ${e.ip?"· IP "+esc(e.ip):""} ${e.ok?"":"· "+esc(e.why)}`).join("<br>")}
 return h+"</div>"}
async function loadRev(){const d=await call("reviews");const o=document.getElementById("rv");if(d.error)return;
 o.innerHTML=d.map(v=>`<div class=r><b>${esc(v.name)}</b> · ${"★".repeat(v.rating)}<br>${esc(v.text)}<br>${v.approved?"SHOWN":"HIDDEN"}<br><button onclick="rev('rev-show','${v.key}')">Show</button><button onclick="rev('rev-hide','${v.key}')">Hide</button><button class=x onclick="rev('rev-delete','${v.key}')">Delete</button></div>`).join("")||"No reviews yet."}
async function load(){loadRev();const d=await call("list");const o=document.getElementById("o");
 if(d.error){o.textContent=d.error;ls.del("apw");return}
 if(rm())ls.set("apw",p());else ls.del("apw");
 o.innerHTML=d.map(r=>`<div class=r><b>${esc(r.name)}</b> · ${esc(r.contact)}<br>Ref: <b>${esc(r.ref)}</b> · ${tm(r.created)}<br>Status: ${r.status}${r.key?` · Key: <b>${r.key}</b> · ${r.revoked?"REVOKED":r.bound?"device bound":"not yet used"}`:""}${dev(r)}<br>
 ${r.status=="pending"?`<button onclick="act('approve','${r.id}')">Approve</button><button class=x onclick="act('reject','${r.id}')">Reject</button>`:""}
 ${r.key?`<button onclick="act('reset','${r.id}')">Reset device</button><button class=x onclick="act('revoke','${r.id}')">Revoke</button>`:""}</div>`).join("")||"No requests yet."}
document.getElementById("p").addEventListener("keydown",e=>{if(e.key==="Enter")load()});
const sv=ls.get("apw");if(sv){document.getElementById("p").value=sv;document.getElementById("rm").checked=true;load()}
</script></body></html>
